//file:noinspection SpellCheckingInspection
plugins {
    id 'idea'
    id 'java-library'
    id 'net.neoforged.moddev.legacyforge' version '2.0.148'
}

group = "azmalent"
version = "${minecraft_version}-${mod_version}"

base {
    archivesName = modid
}

// Minecraft 1.20.1 ships with Java 17, so mods have to target it as well.
java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

legacyForge {
    // NeoForge for 1.20.1 is published as net.neoforged:forge and keeps the
    // legacy net.minecraftforge package names.
    enable {
        neoForgeVersion = "${minecraft_version}-${neo_version}"
    }

    parchment {
        minecraftVersion = parchment_minecraft_version
        mappingsVersion = parchment_mappings_version
    }

    // Validate the access transformer and fail on invalid targets.
    validateAccessTransformers = true

    // Access transformers are picked up from src/main/resources/META-INF/accesstransformer.cfg automatically.
    runs {
        client {
            client()
            systemProperty 'forge.enabledGameTestNamespaces', modid
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'forge.enabledGameTestNamespaces', modid
        }

        data {
            data()
            programArguments.addAll '--mod', modid, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${modid}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

// 'localRuntime' dependencies (such as the full JEI jar) are only used for local testing
// and are not pulled in by projects that depend on this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

obfuscation {
    createRemappingConfiguration(configurations.localRuntime)
}

repositories {
    maven { // JEI
        name = "blamejared"
        url = "https://maven.blamejared.com/"
    }
}

dependencies {
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    modCompileOnly("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}")
    modCompileOnly("mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}")
    modLocalRuntime("mezz.jei:jei-${minecraft_version}-forge:${jei_version}")
}

mixin {
    add sourceSets.main, "${modid}.mixins.refmap.json"
    config "${modid}.mixins.json"
}

jar {
    manifest {
        attributes([
                "Specification-Title"     : modid,
                "Specification-Vendor"    : "azmalent",
                "Specification-Version"   : "1", // We are version 1 of ourselves
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.jar.archiveVersion,
                "Implementation-Vendor"   : "azmalent",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),

                "MixinConfigs"            : "${modid}.mixins.json"
        ])
    }
}

processResources {
    var replaceProperties = [
            'mod_name'               : mod_name, 'mod_version': project.version,
            'mod_description'        : mod_description, 'mod_license': mod_license,
            'mod_homepage'           : mod_homepage, 'mod_github': mod_github,
            'minecraft_version'      : minecraft_version,
            'minecraft_version_range': minecraft_version_range,
            'fml_min'                : fml_min, 'neo_version': neo_version
    ]

    inputs.properties replaceProperties

    filesMatching('META-INF/mods.toml') {
        expand replaceProperties + [project: project]
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << "-Xlint:all,-deprecation,-processing"
}
